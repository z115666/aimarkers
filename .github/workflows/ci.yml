name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: el token del workflow solo puede leer el repositorio
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-seguridad:
    name: Lint y análisis estático (ruff + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Instalar herramientas (versiones y hashes fijados)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Bandit
        run: bandit -c pyproject.toml -r aimarkers.py

  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas unitarias
        run: python -B -m unittest discover tests -v
      - name: Prueba de humo del CLI
        run: python aimarkers.py tests/fixtures/texto/notas_humanas.md --sin-color

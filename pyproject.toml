[project]
name = "aimarkers"
version = "1.5.0"
description = "AI markers analysis for code, documentation, websites, images and Git repositories"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alberto" }]
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 130
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Errores, estilo, imports, modernización, bugs probables y reglas de seguridad (equivalentes a bandit)
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "PERF", "DTZ", "PLW", "RUF100"]
ignore = [
    "E501",    # las expresiones regulares de las reglas son largas por naturaleza
    "E741",    # «l» como variable de línea en comprensiones cortas
    "PERF203", # try/except en bucle para probar codificaciones: es intencionado
    "PERF401",
    "S603",  # subprocess sin shell y con argumentos en lista: revisado y endurecido en git()
    "S607",  # 'git' se resuelve por PATH a propósito
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607", "S608", "E402"]

[tool.bandit]
exclude_dirs = ["tests/fixtures"]
